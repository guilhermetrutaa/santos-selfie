<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f0">
  <title>Sua lembrança | SANTOSELFIE</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:#f8f6f0;color:#191c28;font:16px Arial,sans-serif;display:grid;place-items:center}.card{width:min(100%,520px);padding:28px;border:1px solid #e3e0d8;border-radius:22px;background:#fffefa;text-align:center;box-shadow:0 16px 50px #191c2812}.brand{font-weight:800;letter-spacing:-.06em;margin-bottom:22px}.brand b{color:#2451d8}.photo{display:block;width:100%;max-height:68vh;object-fit:contain;background:#eee;border-radius:8px}.message{color:#656a78;line-height:1.5}.actions{display:grid;gap:10px;margin-top:20px}.button{min-height:54px;padding:14px 18px;border:0;border-radius:12px;background:#f6df25;color:#191c28;font-weight:700;font-size:15px;text-decoration:none;display:flex;align-items:center;justify-content:center}.button.secondary{background:#fff;border:1px solid #d9d7d1}.error{color:#a3214e}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">SANTO<b>SELFIE</b></div>
    <img class="photo" id="photo" alt="Sua foto com o santo" hidden>
    <p class="message" id="message">Carregando sua lembrança…</p>
    <div class="actions" id="actions" hidden>
      <a class="button" id="download">BAIXAR FOTO</a>
      <button class="button secondary" id="share" type="button">COMPARTILHAR FOTO</button>
    </div>
  </main>
  <script>
    const params=new URLSearchParams(location.search),cloud=params.get('cloud'),id=params.get('id'),validCloud=/^[a-z0-9-]+$/i.test(cloud||''),validId=/^[0-9a-f-]{36}$/i.test(id||''),message=document.getElementById('message');
    if(!validCloud||!validId){message.textContent='Este link da foto não é válido.';message.classList.add('error');}
    else{const base=`https://res.cloudinary.com/${cloud}/image/upload/santos-selfie/${id}.jpg`,image=document.getElementById('photo');image.src=base;image.onload=()=>{image.hidden=false;message.textContent='Sua lembrança está pronta para guardar ou compartilhar.';document.getElementById('actions').hidden=false;};image.onerror=()=>{message.textContent='Não foi possível carregar esta foto. Confira sua conexão e tente novamente.';message.classList.add('error');};document.getElementById('download').href=`https://res.cloudinary.com/${cloud}/image/upload/fl_attachment/santos-selfie/${id}.jpg`;document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Minha foto SANTOSELFIE',text:'Uma lembrança especial com um santo.',url:location.href});else await navigator.clipboard.writeText(location.href),message.textContent='Link copiado. Você já pode compartilhar sua foto.';}catch(error){if(error.name!=='AbortError'){message.textContent='Não foi possível compartilhar. Copie o link desta página para enviar sua foto.';}}};}
  </script>
</body>
</html>
